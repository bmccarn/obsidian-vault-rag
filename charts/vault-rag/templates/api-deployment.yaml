{{- if eq .Values.storage.backend "postgresql" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vault-rag.fullname" . }}-api
  labels:
    {{- include "vault-rag.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  {{- if not .Values.api.autoscaling.enabled }}
  replicas: {{ .Values.api.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "vault-rag.componentSelectorLabels" (dict "root" . "component" "api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "vault-rag.componentSelectorLabels" (dict "root" . "component" "api") | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      {{- if .Values.api.topologySpread.enabled }}
      topologySpreadConstraints:
        - maxSkew: {{ .Values.api.topologySpread.maxSkew }}
          topologyKey: {{ .Values.api.topologySpread.topologyKey | quote }}
          whenUnsatisfiable: {{ .Values.api.topologySpread.whenUnsatisfiable }}
          labelSelector:
            matchLabels:
              {{- include "vault-rag.componentSelectorLabels" (dict "root" . "component" "api") | nindent 14 }}
      {{- end }}
      containers:
        - name: api
          image: {{ include "vault-rag.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - api
            - --service-config
            - /config/service.yaml
            - --data-root
            - /tmp/vault-rag
            - --host
            - 0.0.0.0
            - --port
            - "8080"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: VAULT_RAG_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.api.databaseSecret.name }}
                  key: {{ .Values.api.databaseSecret.key }}
            - name: LITELLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.api.runtimeSecret.name }}
                  key: {{ .Values.api.runtimeSecret.litellmKey }}
            - name: VAULT_RAG_EMBEDDING_MODEL
              value: {{ .Values.embeddingModel | quote }}
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /config/service.yaml
              subPath: service.yaml
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: {{ include "vault-rag.fullname" . }}-config
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

{{- end }}