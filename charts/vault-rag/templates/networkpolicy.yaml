{{- if .Values.migrations.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "vault-rag.fullname" . }}-migration
  labels:
    {{- include "vault-rag.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-20"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  podSelector:
    matchLabels:
      {{- include "vault-rag.componentSelectorLabels" (dict "root" . "component" "migration") | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  egress:
    - to:
        {{- range .Values.networkPolicy.egress.databaseCidrs }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      ports:
        {{- range .Values.networkPolicy.egress.databasePorts }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
    - to:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.egress.dnsNamespaceSelector | nindent 12 }}
      ports:
        {{- range .Values.networkPolicy.egress.dnsPorts }}
        - protocol: UDP
          port: {{ . }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
{{- end }}
{{- else }}
