{{- if ne .Values.storage.backend "" }}
{{- include "vault-rag.assertValues" . }}
{{- $serviceConfig := deepCopy .Values.serviceConfig }}
{{- $_ := set $serviceConfig "storage" (fromYaml (include "vault-rag.serviceStorage" .)) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "vault-rag.fullname" . }}-config
  labels:
    {{- include "vault-rag.labels" . | nindent 4 }}
data:
  service.yaml: |
    {{- toYaml $serviceConfig | nindent 4 }}
{{- if and (eq .Values.storage.backend "postgresql") .Values.migrations.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "vault-rag.fullname" . }}-migration-config
  labels:
    {{- include "vault-rag.labels" . | nindent 4 }}
    app.kubernetes.io/component: migration
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
data:
  service.yaml: |
    {{- toYaml $serviceConfig | nindent 4 }}
{{- end }}

{{- end }}