{{- if eq .Values.storage.backend "postgresql" }}
{{- if .Values.api.pdb.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "vault-rag.fullname" . }}-api
  labels:
    {{- include "vault-rag.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  minAvailable: {{ .Values.api.pdb.minAvailable }}
  selector:
    matchLabels:
      {{- include "vault-rag.componentSelectorLabels" (dict "root" . "component" "api") | nindent 6 }}
{{- end }}

{{- if .Values.worker.pdb.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "vault-rag.fullname" . }}-worker
  labels:
    {{- include "vault-rag.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  minAvailable: {{ .Values.worker.pdb.minAvailable }}
  selector:
    matchLabels:
      {{- include "vault-rag.componentSelectorLabels" (dict "root" . "component" "worker") | nindent 6 }}
{{- end }}
{{- end }}
