{{- if eq .Values.storage.backend "postgresql" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vault-rag.fullname" . }}-worker
  labels:
    {{- include "vault-rag.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      {{- include "vault-rag.componentSelectorLabels" (dict "root" . "component" "worker") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "vault-rag.componentSelectorLabels" (dict "root" . "component" "worker") | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.worker.terminationGracePeriodSeconds }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: {{ include "vault-rag.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - worker
            - --service-config
            - /config/service.yaml
            - --data-root
            - /work
          env:
            - name: VAULT_RAG_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.worker.databaseSecret.name }}
                  key: {{ .Values.worker.databaseSecret.key }}
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.worker.runtimeSecret.name }}
                  key: {{ .Values.worker.runtimeSecret.githubToken }}
            - name: LITELLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.worker.runtimeSecret.name }}
                  key: {{ .Values.worker.runtimeSecret.litellmKey }}
            - name: VAULT_RAG_EMBEDDING_MODEL
              value: {{ .Values.embeddingModel | quote }}
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - kill -0 1
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - vault-rag
                - db
                - check
                - --service-config
                - /config/service.yaml
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: checkout
              mountPath: /work
            - name: config
              mountPath: /config/service.yaml
              subPath: service.yaml
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: checkout
          emptyDir:
            sizeLimit: {{ .Values.worker.checkout.sizeLimit | quote }}
        - name: config
          configMap:
            name: {{ include "vault-rag.fullname" . }}-config
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

{{- end }}