image:
  repository: ghcr.io/example/vault-rag
  tag: "0.1.0"
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

service:
  annotations: {}

storage:
  backend: ""
  className: null
  size: null
  replicas: null
  databaseUrlEnv: null
  ownerRole: null
  pool: null
  connectTimeout: null
  statementTimeout: null
  lockTimeout: null
  idleTransactionTimeout: null
  allowInsecureTransport: null
  cleanup: null

api: null
worker: null
migrations: null
sqlite: null

embeddingModel: text-embedding-3-large

serviceConfig:
  schemaVersion: 2
  syncInterval: 5m
  mcp:
    enabled: false
    allowedHosts: []
    allowedOrigins: []
  repositories:
    example-vault:
      url: https://github.com/example/vault-rag-example.git
      ref: refs/heads/main
      credentialEnv: GITHUB_TOKEN
  profiles:
    example:
      vaults:
        - example-vault
  embedding:
    baseUrl: https://litellm.example.test/v1
    apiKeyEnv: LITELLM_API_KEY
    modelEnv: VAULT_RAG_EMBEDDING_MODEL
    endpointClass: remote
    revision: baseline-2026-08
    dimensions: 1024

monitoring:
  serviceMonitor: false
  podMonitor: false

networkPolicy:
  enabled: false
  ingress:
    cidrs:
      - 192.0.2.0/32
    ports:
      - 8080
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: monitoring
  egress:
    databaseCidrs:
      - 192.0.2.0/32
    databasePorts:
      - 5432
    httpsCidrs:
      - 192.0.2.0/32
    httpsPorts:
      - 443
    dnsNamespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: kube-system
    dnsPorts:
      - 53

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
