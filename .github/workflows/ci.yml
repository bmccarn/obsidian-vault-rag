name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  sqlite-tests:
    name: SQLite tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          cache-suffix: sqlite-py-${{ matrix.python-version }}
      - name: Install Python
        run: uv python install "${{ matrix.python-version }}"
      - name: Sync locked environment
        run: uv sync --frozen --python "${{ matrix.python-version }}"
      - name: Exercise documented lexical quickstart
        run: bash examples/lexical-demo.sh
      - name: Run complete SQLite suite
        run: uv run --python "${{ matrix.python-version }}" pytest -q

  postgres-contract:
    name: PostgreSQL 18 contracts (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    services:
      postgres:
        image: pgvector/pgvector:pg18@sha256:691673308c99d2161ba298736f3147f1f22d79de2fb7ec93ae9b4afcab870b62
        env:
          POSTGRES_DB: vault_rag_test
          POSTGRES_PASSWORD: vault-rag-ci-password
          POSTGRES_USER: vault_rag
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vault_rag -d vault_rag_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          cache-suffix: postgres-contract-py-${{ matrix.python-version }}
      - name: Install Python
        run: uv python install "${{ matrix.python-version }}"
      - name: Sync locked environment
        run: uv sync --frozen --python "${{ matrix.python-version }}"
      - name: Run guarded PostgreSQL cleanup and migration contracts
        env:
          VAULT_RAG_TEST_POSTGRES_DSN: postgresql://vault_rag:vault-rag-ci-password@127.0.0.1:5432/vault_rag_test
          VAULT_RAG_REQUIRE_POSTGRES: "1"
        run: >-
          uv run --python "${{ matrix.python-version }}" pytest -q
          tests/contract/postgres/test_migrations.py tests/contract/postgres/test_cleanup.py
      - name: Run PostgreSQL 18 contract tests
        env:
          VAULT_RAG_TEST_POSTGRES_DSN: postgresql://vault_rag:vault-rag-ci-password@127.0.0.1:5432/vault_rag_test
          VAULT_RAG_REQUIRE_POSTGRES: "1"
        run: uv run --python "${{ matrix.python-version }}" pytest -q tests/contract/postgres

  postgres-coverage:
    name: PostgreSQL 18 coverage (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    services:
      postgres:
        image: pgvector/pgvector:pg18@sha256:691673308c99d2161ba298736f3147f1f22d79de2fb7ec93ae9b4afcab870b62
        env:
          POSTGRES_DB: vault_rag_test
          POSTGRES_PASSWORD: vault-rag-ci-password
          POSTGRES_USER: vault_rag
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vault_rag -d vault_rag_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          cache-suffix: postgres-coverage-py-${{ matrix.python-version }}
      - name: Install Python
        run: uv python install "${{ matrix.python-version }}"
      - name: Sync locked environment
        run: uv sync --frozen --python "${{ matrix.python-version }}"
      - name: Run PostgreSQL subsystem coverage
        env:
          VAULT_RAG_TEST_POSTGRES_DSN: postgresql://vault_rag:vault-rag-ci-password@127.0.0.1:5432/vault_rag_test
          VAULT_RAG_REQUIRE_POSTGRES: "1"
        run: >-
          uv run --python "${{ matrix.python-version }}" pytest -q
          --cov=src/vault_rag/storage/postgres --cov=src/vault_rag/service
          --cov-report=term --cov-fail-under=90

  release-gates:
    name: Release safety and deployment contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
      - name: Scan public history for secrets
        shell: bash
        run: |
          set -euo pipefail
          archive=gitleaks_8.30.1_linux_x64.tar.gz
          curl --fail --location --silent --show-error --output "$RUNNER_TEMP/$archive" "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/$archive"
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' "$RUNNER_TEMP/$archive" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git . --redact --log-opts="--all"
      - name: Sync locked environment
        run: uv sync --frozen
      - name: Audit frozen runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          uv export --frozen --no-dev --no-emit-project --format requirements-txt --output-file runtime-requirements.txt
          uv run pip-audit --strict --requirement runtime-requirements.txt
      - name: Install checksum-verified Helm 3
        shell: bash
        run: |
          set -euo pipefail
          HELM_VERSION=3.16.3
          HELM_ARCHIVE="helm-v${HELM_VERSION}-linux-amd64.tar.gz"
          curl --fail --location --silent --show-error --output "$HELM_ARCHIVE" "https://get.helm.sh/$HELM_ARCHIVE"
          printf '%s  %s\n' "f5355c79190951eed23c5432a3b920e071f4c00a64f75e077de0dd4cb7b294ea" "$HELM_ARCHIVE" | sha256sum --check --status
          tar --extract --gzip --file "$HELM_ARCHIVE" linux-amd64/helm
          install -m 0755 linux-amd64/helm "$RUNNER_TEMP/helm"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Render both Helm storage modes
        shell: bash
        run: |
          set -euo pipefail
          helm lint charts/vault-rag
          helm template vault-rag charts/vault-rag --values tests/fixtures/helm/sqlite-values.yaml > "$RUNNER_TEMP/sqlite.yaml"
          helm template vault-rag charts/vault-rag --values tests/fixtures/helm/postgresql-values.yaml > "$RUNNER_TEMP/postgresql.yaml"
      - name: Strictly validate both rendered Helm modes
        shell: bash
        run: |
          set -euo pipefail
          KUBECONFORM_VERSION=0.6.7
          KUBECONFORM_IMAGE="ghcr.io/yannh/kubeconform:v${KUBECONFORM_VERSION}@sha256:0925177fb05b44ce18574076141b5c3d83235e1904d3f952182ac99ddc45762c"
          for rendered in "$RUNNER_TEMP/sqlite.yaml" "$RUNNER_TEMP/postgresql.yaml"; do
            docker run --rm --volume "$RUNNER_TEMP:/work:ro" --workdir /work "$KUBECONFORM_IMAGE" -strict -ignore-missing-schemas -summary "$(basename "$rendered")"
          done
      - name: Verify content safety and packaged migrations
        run: >-
          uv run pytest -q tests/integration/test_packaging.py tests/integration/test_documentation.py
          tests/integration/test_helm_contract.py tests/integration/test_container_contract.py
      - name: Verify pinned base and service image digests
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          for path in (Path("Dockerfile"), Path("compose.yaml")):
              text = path.read_text(encoding="utf-8")
              for image in re.findall(r"(?:FROM|image:)\s*([^\s]+)", text):
                  if "@sha256:" not in image:
                      raise SystemExit(f"mutable image reference in {path}: {image}")
          PY
      - name: Lint and type-check
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests
          uv run mypy src
      - name: Build distributions and smoke artifacts
        shell: bash
        run: |
          set -euo pipefail
          uv build --out-dir dist
          wheel=$(find dist -maxdepth 1 -name '*.whl' -print -quit)
          sdist=$(find dist -maxdepth 1 -name '*.tar.gz' -print -quit)
          test -n "$wheel"
          test -n "$sdist"
          uvx --from "$wheel" vault-rag version --json
          uvx --from "$sdist" vault-rag version --json
      - name: Lint tracked Markdown and patches
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          git ls-files -z '*.md' | xargs -0 node_modules/.bin/markdownlint-cli2 --
          git diff --check

  container:
    name: Build and smoke PostgreSQL 18 split runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Build and verify the private split runtime
        shell: bash
        run: |
          set -euo pipefail
          cleanup() {
            status=$?
            if [ "$status" -ne 0 ]; then
              docker compose logs --tail=100 postgres git-fixture migrate api-a api-b worker-a worker-b || true
            fi
            docker compose down --volumes --remove-orphans || true
            return "$status"
          }
          trap cleanup EXIT
          bash deploy/docker/prepare-demo.sh
          docker compose build
          docker compose up --detach postgres git-fixture migrate api-a api-b worker-a worker-b
          docker compose run --rm smoke verify
          docker compose restart api-a
          docker compose run --rm smoke verify
          docker compose restart worker-a
          docker compose run --rm smoke verify

  publish-image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [sqlite-tests, postgres-contract, postgres-coverage, release-gates, container]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Authenticate to GHCR
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push immutable image
        shell: bash
        run: |
          set -euo pipefail
          image=ghcr.io/${GITHUB_REPOSITORY}
          immutable_tag=sha-${GITHUB_SHA}
          docker build --tag "${image}:${immutable_tag}" .
          docker push "${image}:${immutable_tag}"
      - name: Record immutable image reference
        shell: bash
        run: |
          set -euo pipefail
          image=ghcr.io/${GITHUB_REPOSITORY}
          digest=$(docker buildx imagetools inspect "${image}:sha-${GITHUB_SHA}" --format '{{.Manifest.Digest}}')
          printf 'Published image: `%s@%s`\n' "$image" "$digest" >> "$GITHUB_STEP_SUMMARY"
